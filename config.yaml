  inspecting: "INSPECTING {zone_name} - KEEP HAND ON PART"

# ──────────────────────────────────────────────────────────────────────────────
# OCR Engine Settings — Change these without touching any Python code.
# ──────────────────────────────────────────────────────────────────────────────
ocr:
  # --- Voting / Speed vs. Accuracy ---
  # vote_window:    Max recent frames to remember. (Default: 4)
  # vote_threshold: Matching reads needed to LOCK the serial. (Default: 2)
  #   Lower threshold = faster but less accurate.
  #   Higher threshold = slower but more robust against bad reads.
  vote_window: 3
  vote_threshold: 2

  # --- Image Preprocessing Filters ---
  # Disable a filter by setting it to false to save processing time.
  # Re-enable anytime here if accuracy drops.

  # Zoom: Upscales crop before OCR. ESSENTIAL — PaddleOCR needs large images.
  zoom_factor: 2

  # CLAHE: Boosts local contrast for faint laser-etched text on dark metal. ESSENTIAL.
  clahe_enabled: true
  clahe_clip_limit: 3.0
  clahe_tile_size: 8

  # Median Blur: Removes camera noise. Runs fast. Recommended.
  median_blur_enabled: true
  median_blur_ksize: 3

  # Otsu Binarization: Converts to pure black/white for character clarity. ESSENTIAL.
  otsu_enabled: true

  # Morphological Close: Fills gaps in broken character strokes. Optional.
  # Disable if serial text is clean and well-lit (saves a tiny bit of time).
  morph_close_enabled: true
  morph_close_ksize: 2

  # Sharpen (Unsharp Mask): Sharpens blurry edges before preprocessing. Optional.
  # Disable if the industrial camera image is already sharp.
  sharpen_enabled: true

  # Auto-Rotate: Rotates vertical serial crops to horizontal before OCR.
  # Keep true unless your serial label is always horizontal.
  auto_rotate_enabled: true

