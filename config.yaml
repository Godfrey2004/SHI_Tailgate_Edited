  seq_innerzone2: 0.50
  seq_outerzone1: 0.50
  seq_outerzone2: 0.50

timings:
  capture_delay_inner1: 2.0
  capture_delay_inner2: 2.0
  capture_delay_outer1: 7.0
  capture_delay_outer2: 2.0
  inspect_time_inner1: 10.0
  inspect_time_inner2: 5.0
  inspect_time_outer1: 5.0
